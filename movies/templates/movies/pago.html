{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Suscripción - Uneflix</title>
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070b12;
            --card-bg: #101726;
            --unefa-blue: #004bca;
            --unefa-bronze: #d19a4e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .payment-box {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 8px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* LOGO CON "CAMBIAZO" A IMAGEN */
        .logo-center {
            display: block;
            margin: 0 auto 24px auto;
            width: 220px;
            height: 60px;
            background-image: url("{% static 'images/logo.png' %}");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            text-indent: -9999px;
            overflow: hidden;
            line-height: 0;
            color: transparent !important;
        }
        .logo-center span { display: none; }

        h2 { font-size: 18px; font-weight: 500; margin-bottom: 4px; color: #fff; }

        .plan-summary {
            background: rgba(255,255,255,0.03);
            padding: 12px 16px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-left: 3px solid var(--unefa-blue);
        }

        .plan-summary span { font-weight: 600; color: #fff; }
        .plan-summary p { font-size: 13px; color: #aaa; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            border-radius: 4px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus { outline: none; background: rgba(0,0,0,0.5); border-color: var(--unefa-blue); }

        .row-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .btn-pay {
            width: 100%;
            background: var(--unefa-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-pay:hover { background: var(--unefa-bronze); color: #000; }

        .loading-overlay, .success-overlay {
            position: absolute; inset: 0; background: var(--card-bg); border-radius: 8px;
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }

        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--unefa-blue); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .success-icon {
            width: 60px; height: 60px; background: rgba(46, 204, 113, 0.15); color: #2ecc71;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 32px; margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="payment-box">
        <div class="loading-overlay" id="loadingOverlay" style="display:none;">
            <div class="spinner"></div>
            <p style="font-size: 14px; color: #ccc;">Procesando pago seguro...</p>
        </div>

        <div class="success-overlay" id="successOverlay" style="display:none;">
            <div class="success-icon">✓</div>
            <h3>¡Pago Procesado!</h3>
            <p>Tu membresía ha sido activada con éxito.</p>
            <button class="btn-pay" onclick="window.location.href='{% url 'home' %}'">Empezar a ver</button>
        </div>

        <span class="logo-center">UNE<span>FLIX</span></span>
        
        <h2>Detalles de la Suscripción</h2>
        <div class="plan-summary">
            <div>
                <p>Plan seleccionado</p>
                <span id="planName">Cargando...</span>
            </div>
            <span id="planPrice" style="font-size: 18px;">$0.00/mes</span>
        </div>

        <form id="paymentForm" onsubmit="procesarPagoFicticio(event)">
            <div class="form-group">
                <label>Nombre en la tarjeta</label>
                <input type="text" placeholder="Israel Rodriguez" required>
            </div>
            <div class="form-group">
                <label>Número de tarjeta</label>
                <input type="text" id="cardnumber" placeholder="5416 •••• •••• 4321" maxlength="19" required>
            </div>
            <div class="row-inputs">
                <div class="form-group">
                    <label>Vencimiento</label>
                    <input type="text" id="expdate" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="password" placeholder="•••" maxlength="3" required>
                </div>
            </div>
            <button type="submit" class="btn-pay">Activar Membresía</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan') || '{{ plan }}';
        const precio = urlParams.get('precio') || '{{ precio }}';

        document.getElementById('planName').textContent = 'Plan ' + plan;
        document.getElementById('planPrice').textContent = '$' + precio + '/mes';

        document.getElementById('cardnumber').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });

        document.getElementById('expdate').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{2})/, '$1/').trim();
        });

        function procesarPagoFicticio(event) {
            event.preventDefault();
            document.getElementById('loadingOverlay').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('successOverlay').style.display = 'flex';
            }, 2500);
        }
    </script>
</body>
</html>
