{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uneflix - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            background: url("{% static 'images/fondo_uneflix.jpg' %}") center/cover no-repeat;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
        }

        .right-panel {
            position: relative;
            z-index: 2;
            margin-left: auto;
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            color: #e50914;
            font-size: 48px;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            align-self: flex-start;
        }

        .field { margin-bottom: 16px; width: 100%; }

        .field label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            padding: 10px 14px;
            color: white;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border 0.2s;
        }

        .field input:focus {
            outline: none;
            border-color: #e50914;
        }

        .btn {
            width: 100%;
            background: #e50914;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn:hover { background: #c40812; }

        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }

        .link a {
            color: #e50914;
            text-decoration: none;
            font-weight: 500;
        }

        .errors {
            background: rgba(229,9,20,0.15);
            border: 1px solid rgba(229,9,20,0.3);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            color: #ff6b6b;
            margin-bottom: 16px;
            width: 100%;
        }

        .help-text {
            font-size: 11px;
            color: #555;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .right-panel {
                max-width: 100%;
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="right-panel">
        <span class="logo">UNEFLIX</span>
        <h2>Crear Cuenta</h2>
        {% if form.errors %}
        <div class="errors">
            {% for field in form %}
                {% for error in field.errors %}{{ error }}{% endfor %}
            {% endfor %}
        </div>
        {% endif %}
        <form method="post" style="width:100%;">
            {% csrf_token %}
            <div class="field">
                <label>Usuario</label>
                <input type="text" name="username">
            </div>
            <div class="field">
                <label>Contraseña</label>
                <input type="password" name="password1">
                <p class="help-text">Mínimo 8 caracteres.</p>
            </div>
            <div class="field">
                <label>Confirmar Contraseña</label>
                <input type="password" name="password2">
            </div>
            <button type="submit" class="btn">Registrarse</button>
        </form>
        <div class="link">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
